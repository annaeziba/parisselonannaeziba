<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2a44">
<title>Mappa di Parigi / Carte de Paris</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400;1,600&display=swap">
<style>
  :root {
    --navy: #1f2a44;
    --it: #2e8b57;
    --fr: #2f5fb3;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
    padding: calc(10px + var(--safe-top)) 16px 10px;
    background: var(--navy); color: #fff;
    display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
  }
  header h1 { margin: 0; font-size: 1.05rem; font-weight: 650; }
  header span { font-size: .75rem; opacity: .75; text-align: right; }

  #map {
    position: fixed; left: 0; right: 0; bottom: 0;
    top: calc(44px + var(--safe-top));
    height: auto;
  }

  /* Segnaposto grandi, facili da toccare */
  .pin { background: none; border: none; }
  .pin .bubble {
    width: 44px; height: 44px; border-radius: 50% 50% 50% 8px;
    transform: rotate(-45deg);
    background: #fff; border: 3px solid var(--navy);
    box-shadow: 0 3px 8px rgba(0,0,0,.35);
    display: flex; align-items: center; justify-content: center;
    transition: transform .15s, background .15s;
  }
  .pin .bubble span { transform: rotate(45deg); font-size: 22px; line-height: 1; }
  .pin.active .bubble { background: #ffd54a; transform: rotate(-45deg) scale(1.15); }

  /* Barra di scelta rapida */
  #chips {
    position: fixed; left: 0; right: 0; z-index: 900;
    bottom: calc(10px + var(--safe-bottom));
    display: flex; gap: 8px; padding: 0 12px; overflow-x: auto;
    scrollbar-width: none; -webkit-overflow-scrolling: touch;
    transition: opacity .2s, transform .25s;
  }
  #chips::-webkit-scrollbar { display: none; }
  #chips.hidden { opacity: 0; pointer-events: none; transform: translateY(20px); }
  .chip {
    flex: 0 0 auto; min-height: 44px; padding: 0 16px;
    border: none; border-radius: 22px; background: #fff; color: var(--navy);
    font: inherit; font-size: .9rem; font-weight: 600;
    box-shadow: 0 2px 8px rgba(0,0,0,.28);
  }
  .chip:active { background: #e9edf6; }

  /* Bottone posizione */
  #locate {
    position: fixed; right: 12px; z-index: 900;
    bottom: calc(68px + var(--safe-bottom));
    width: 48px; height: 48px; border: none; border-radius: 50%;
    background: #fff; font-size: 22px; box-shadow: 0 2px 8px rgba(0,0,0,.3);
    transition: opacity .2s;
  }
  #locate.hidden { opacity: 0; pointer-events: none; }

  .leaflet-control-zoom { display: none; } /* su telefono si usa il pizzico */
  .leaflet-control-attribution { font-size: 9px; }

  /* Scheda in basso (bottom sheet) */
  #sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 1100;
    max-height: 68dvh; max-height: 68vh;
    max-height: 68dvh;
    background: #fff; border-radius: 18px 18px 0 0;
    box-shadow: 0 -4px 20px rgba(0,0,0,.3);
    transform: translateY(105%); transition: transform .28s ease;
    display: flex; flex-direction: column;
    padding-bottom: var(--safe-bottom);
  }
  #sheet.open { transform: translateY(0); }
  #sheet.dragging { transition: none; }

  .handle-zone { padding: 10px 0 6px; touch-action: none; flex: 0 0 auto; }
  .handle { width: 42px; height: 5px; border-radius: 3px; background: #c4c9d4; margin: 0 auto; }

  #close {
    position: absolute; top: 8px; right: 10px; z-index: 2;
    width: 44px; height: 44px; border: none; border-radius: 50%;
    background: rgba(255,255,255,.92); color: var(--navy);
    font-size: 22px; line-height: 1; box-shadow: 0 1px 6px rgba(0,0,0,.25);
  }

  .scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  .photo {
    position: relative; width: 100%; aspect-ratio: 16 / 9; background: #dfe4ee;
  }
  .photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo .fallback {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    font-size: 3.5rem; background: linear-gradient(135deg, #c9d3ea, #e9edf6);
  }
.body {
  padding: 14px 18px 20px;
  font-family: "EB Garamond", Garamond, "Times New Roman", serif;
}
.body h2 { margin: 0 0 12px; font-size: 1.45rem; font-weight: 600; color: var(--navy); }

.lang { margin: 0; }

/* Separatore tra le due lingue: spazio + filetto con un rombo al centro */
.lang.fr { position: relative; margin-top: 30px; padding-top: 26px; }
.lang.fr::before {
  content: ""; position: absolute; top: 0; left: 8%; right: 8%; height: 1px;
  background: linear-gradient(90deg, transparent, #b9c0d0 20%, #b9c0d0 80%, transparent);
}
.lang.fr::after {
  content: ""; position: absolute; top: -4px; left: 50%;
  width: 9px; height: 9px; margin-left: -4.5px;
  background: #fff; border: 1px solid #b9c0d0; transform: rotate(45deg);
}
.lang p {
  margin: 0; font-size: 1.12rem; line-height: 1.55; color: #2b2b2b;
  text-align: justify; text-justify: inter-word;
  hyphens: auto; -webkit-hyphens: auto;
}
.lang em { font-style: italic; }       /* francese in corsivo */
.lang.it em { font-style: italic; }     /* nomi e termini evidenziati in corsivo */
.lang b {
  display: inline-block; font-size: .7rem; letter-spacing: .06em;
  padding: 3px 8px; border-radius: 4px; color: #fff; margin-bottom: 8px;
}
.lang p { margin: 0; font-size: 1rem; line-height: 1.5; color: #2b2b2b; }

  /* Schermi larghi: scheda centrata */
  @media (min-width: 700px) {
    #sheet { left: 50%; right: auto; width: 560px; transform: translate(-50%, 105%); }
    #sheet.open { transform: translate(-50%, 0); }
  }

  /* Schermi larghi: scheda centrata */
  @media (min-width: 700px) {
    #sheet { left: 50%; right: auto; width: 560px; transform: translate(-50%, 105%); }
    #sheet.open { transform: translate(-50%, 0); }
  }
</style>
</head>

<header>
  <h1>La Parigi di Anna & Ziba · Paris selon Anna & Ziba</h1>

      it: "Ziba ama guardare film, mentre Anna soffre di fulminea narcolessia già dai titoli di testa, alternando domande randomiche sullo svolgimento della trama e le azioni dei personaggi. Per questo, Ziba ha escogitato una tecnica infallibile, ossia trascinare Anna al cinema UGC di les Halles: schermi grandi e suono potente si rivelano degli alleati potenti contro i frequenti attacchi di sonno. Lista non ragionata e non esaustiva dei film visti insieme: <em> Memoir of a snail, Juror #2, The Whale, Napoleon, The Brutalist, Anatomie d’une chute, Anora, Poor Things… </em>",
      fr: "Ziba adore regarder des films, tandis qu’Anna souffre d’une narcolepsie fulgurante dès le générique de début, ponctuée de questions aléatoires sur le déroulement de l’intrigue et les actions des personnages. C’est pourquoi Ziba a mis au point une technique infaillible : traîner Anna au cinéma UGC de les Halles. Les grands écrans et le son puissant se révèlent être de précieux alliés contre les (très) fréquentes attaques de sommeil. Liste non raisonnée et non exhaustive des films vus ensemble : <em>Memoir of a snail, Juror #2, The Whale, Napoleon, The Brutalist, Anatomie d’une chute, Anora, Poor Things…</em>"
    },
    {
      short: "Comédie", name: "La Comédie Française", emoji: "🎭", lat: 48.86357, lng: 2.33594,
      file: "comedie.jpg", 
      it: "Teatro più importante di Parigi, frequentato da Anna e Ziba a più riprese. Menzione d’onore allo spettacolo di Paul Claudel <em>Le soulier de satin</em>, per la mise en scène di Éric Ruf, in quattro parti, per una durata totale di 7 ore e 50 minuti. Incredibilmente, Anna non si è addormentata ed è anzi uscita entusiasta dalla sala, colpita in particolare dalla gente che si era portata i panini da casa e se li era successivamente scofanati tra un atto e l’altro. Esperienza assolutamente da replicare.",

      it: "L’organizzazione e la gestione discutibile delle cose da parte di Ziba ha fatto sì che dopo la proposta di matrimonio (accettata, fiut), i due dovessero subito dopo andare al Théâtre de la Colline a vedere una tremenda pièce di Wajdi Mouawad dal titolo assolutamente non promettente <em>Willy Protagoras rinchiuso nel cesso (Willy Protagoras enfermé dans les toilettes)</em>; il tutto a stomaco vuoto e ancora nel pieno dello squilibrio emotivo successivo alla proposta. Per fortuna, la presenza provvidenziale di un Mc affianco al teatro ha salvato capra e cavoli, permettendo ai ragazzi di rifocillarsi e di ristabilirsi emozionalmente.",
      fr: "L’organisation et la gestion pour le moins discutable des choses par Ziba ont fait qu’après la demande en mariage (acceptée, fiout !), les deux ont dû se rendre immédiatement au Théâtre de la Colline pour assister à une terrible pièce de Wajdi Mouawad au titre absolument peu prometteur : <em>Willy Protagoras enfermé dans les toilettes </em>; le tout le ventre vide et encore en plein déséquilibre émotionnel après la demande en mariage. Heureusement, la présence providentielle d’un McDonald’s juste à côté du théâtre a permis de sauver la situation, offrant aux deux jeunes gens l’occasion de se restaurer et de retrouver leur équilibre émotionnel."

      it: "Ristorante cinese preferito di Anna e Ziba e comfort food per eccellenza. Ziba è solito prendere i famigerati Nouilles Dan Dan, un piatto assurdo con dentro di tutto (tra cui un tuorlo crudo), e proprio forse da qui è nata la voglia di andare in Cina. Anna ci viene sempre controvoglia dicendo “Ma certo che mi va”, salvo poi prendere sempre il riso alla cantonese dopo aver comunque sfogliato tutto il menù, oppure alla peggio prendendo d’asporto il cibo in un locale affianco il cui piatto forte sono delle palle di riso. La cosa che fa più ridere è che c’è un piatto che dalle foto sembra polenta e ragù, ma che sicuramente non lo è. Nessuno lo ha mai provato.",
      fr: "Le restaurant chinois préféré d’Anna et Ziba, et leur comfort food par excellence. Ziba prend habituellement les fameuses Nouilles Dan Dan, un plat complètement improbable dans lequel on trouve un peu de tout (dont un jaune d’œuf cru), et c’est peut-être justement de là qu’est née l’envie d’aller en Chine. Anna y vient toujours à contrecœur en disant « Mais oui, bien sûr que ça me dit », avant de prendre systématiquement le riz cantonais après avoir tout de même feuilleté l’intégralité du menu, ou, au pire, de prendre à emporter dans un restaurant juste à côté, dont la spécialité est constituée de boules de riz. Le plus drôle, c’est qu’il y a un plat qui, sur les photos, ressemble à de la polenta avec du ragù, mais qui n’en est certainement pas. Personne ne l’a jamais goûté."

    {

      it: "Luogo preferito per le passeggiate e a detta di entrambi il miglior posto di Parigi. Imperativo il tè matcha rigorosamente da Kitsuné, anche se Ziba è solito versarselo addosso ed essere conseguentemente preso in giro da Anna. Attività preferita a Palais Royal è lo <em>Shiba-watching</em>, vale a dire il conto del numero di shiba presenti a spasso con i rispettivi padroni. Dopo averne visto uno, Ziba è solito esclamare con fare infantile Cane, per essere ancora una volta preso in giro da Anna perché non ha il coraggio di andare ad accarezzarli. I due sono anche soliti passare davanti ai ristoranti lì presenti paventando la possibilità di poterci mangiare un giorno: sogno infranto una volta consultati i prezzi sul menù. ",

  /* ---------- Mappa ---------- */
  const map = L.map("map", {
    zoomControl: false,
    tap: true,
    attributionControl: true
  }).setView([48.8650, 2.3300], 12);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a>'
  }).addTo(map);

  /* ---------- Elementi UI ---------- */
  const sheet = document.getElementById("sheet");
  const chips = document.getElementById("chips");
  const locateBtn = document.getElementById("locate");
  const imgEl = document.getElementById("sheet-img");
  const fbEl = document.getElementById("sheet-fallback");
  let activeIndex = null;
  const markers = [];

  function makeIcon(emoji, active) {
    return L.divIcon({
      className: "pin" + (active ? " active" : ""),
      html: '<div class="bubble"><span>' + emoji + "</span></div>",
      iconSize: [44, 44],
      iconAnchor: [22, 44]
    });
  }

  function openPlace(i) {
    const p = places[i];

    if (activeIndex !== null) markers[activeIndex].setIcon(makeIcon(places[activeIndex].emoji, false));
    activeIndex = i;
    markers[i].setIcon(makeIcon(p.emoji, true));

  document.getElementById("sheet-title").textContent = p.name;
  document.getElementById("sheet-it").innerHTML = p.it;
  document.getElementById("sheet-fr").innerHTML = p.fr;


    imgEl.style.display = "block";
    fbEl.style.display = "none";
    fbEl.textContent = p.emoji;
    imgEl.alt = p.name;
    imgEl.onerror = () => { imgEl.style.display = "none"; fbEl.style.display = "flex"; };
    imgEl.src = IMG_BASE ? IMG_BASE + p.file : wiki(p.wiki);

    sheet.querySelector(".scroll").scrollTop = 0;
    sheet.classList.add("open");
    chips.classList.add("hidden");
    locateBtn.classList.add("hidden");

    // Sposta la mappa in modo che il segnaposto resti visibile sopra la scheda
    requestAnimationFrame(() => {
      const z = Math.max(map.getZoom(), 14);
      const pt = map.project([p.lat, p.lng], z);
      pt.y += sheet.offsetHeight / 2 - 22;
      map.flyTo(map.unproject(pt, z), z, { duration: 0.6 });
    });
  }

  function closeSheet() {
    sheet.classList.remove("open");
    sheet.style.transform = "";
    chips.classList.remove("hidden");
    locateBtn.classList.remove("hidden");
    if (activeIndex !== null) {
      markers[activeIndex].setIcon(makeIcon(places[activeIndex].emoji, false));
      activeIndex = null;
    }
  }

  /* ---------- Segnaposto e scorciatoie ---------- */
  places.forEach((p, i) => {
    const m = L.marker([p.lat, p.lng], { icon: makeIcon(p.emoji, false), title: p.name, riseOnHover: true })
      .addTo(map)
      .on("click", () => openPlace(i));
    markers.push(m);

    const b = document.createElement("button");
    b.className = "chip";
    b.textContent = p.emoji + " " + p.short;
    b.addEventListener("click", () => openPlace(i));
    chips.appendChild(b);
  });

  map.fitBounds(L.latLngBounds(places.map(p => [p.lat, p.lng])), { paddingTopLeft: [30, 30], paddingBottomRight: [30, 90] });

  /* ---------- Chiusura ---------- */
  document.getElementById("close").addEventListener("click", closeSheet);
  map.on("click", closeSheet);

  // Trascina la scheda verso il basso per chiuderla
  (function enableSwipe() {
    const zone = sheet.querySelector(".handle-zone");
    let startY = null, dy = 0;
    zone.addEventListener("touchstart", (e) => {
      startY = e.touches[0].clientY; dy = 0; sheet.classList.add("dragging");
    }, { passive: true });
    zone.addEventListener("touchmove", (e) => {
      if (startY === null) return;
      dy = Math.max(0, e.touches[0].clientY - startY);
      sheet.style.transform = "translateY(" + dy + "px)";
    }, { passive: true });
    zone.addEventListener("touchend", () => {
      sheet.classList.remove("dragging");
      if (dy > 90) closeSheet(); else sheet.style.transform = "";
      startY = null;
    });
  })();

  /* ---------- La mia posizione ---------- */
  let me = null;
  locateBtn.addEventListener("click", () => map.locate({ setView: true, maxZoom: 15 }));
  map.on("locationfound", (e) => {
    if (me) map.removeLayer(me);
    me = L.circleMarker(e.latlng, { radius: 9, color: "#fff", weight: 3, fillColor: "#1a73e8", fillOpacity: 1 }).addTo(map);
  });
  map.on("locationerror", () => alert("Posizione non disponibile / Position indisponible"));
</script>
